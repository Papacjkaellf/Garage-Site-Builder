kind = "web"
previewPath = "/"
title = "Manchester Auto Service"
version = "1.0.0"
id = "artifacts/manchester-auto-service"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22255

[services.development]
run = "pnpm --filter @workspace/manchester-auto-service run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manchester-auto-service", "run", "build" ]
publicDir = "artifacts/manchester-auto-service/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22255"
BASE_PATH = "/"
