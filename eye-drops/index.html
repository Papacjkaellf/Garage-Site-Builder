<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prednisolone — график</title><style>*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:#090b0f;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px 14px 112px}main{max-width:680px;margin:auto}header{position:sticky;top:0;z-index:4;background:#090b0fe8;backdrop-filter:blur(14px);padding:12px 2px 14px}h1{font-size:25px;margin:0 0 4px}header p{margin:0;color:#9299a7;font-size:14px}.day{background:#171a20;border:1px solid #282c34;border-radius:18px;padding:15px;margin:11px 0}.today{border:2px solid #719eff}.complete{border-color:#2d8752}.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.head b{font-size:18px}.tag{display:block;color:#7da6ff;font-weight:800;font-size:11px;margin-top:3px}.mode{text-align:right;color:#9ca3af;font-size:13px}.doses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dose{display:flex;align-items:center;gap:7px;background:#242831;border-radius:12px;padding:11px 8px;font-weight:750}.dose.done{background:#153824;color:#baf3cf}input{width:22px;height:22px;accent-color:#38d47a}.track{height:6px;background:#292d35;border-radius:8px;overflow:hidden;margin-top:12px}.track i{display:block;height:100%;background:#38d47a}#save{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,640px);height:58px;border:0;border-radius:17px;font-size:17px;font-weight:850;background:#f4f5f7;color:#111;z-index:9}@media(max-width:390px){.doses{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><header><h1>💧 Prednisolone 1%</h1><p>Правый глаз · курс 02.09–15.10.2026</p></header><div id="list"></div></main><button id="save">✓ Сохранить отметки</button><script>const KEY='pred_eye_online_v1',WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),weekend=d=>d.getDay()==0||d.getDay()==6;function info(d){let x=ymd(d);if(x<='2026-09-03')return['каждый час',Array.from({length:17},(_,i)=>pad(i+7)+':00')];if(x<='2026-09-10')return['каждые 2 часа',['07:00','09:00','11:00','13:00','15:00','17:00','19:00','21:00','23:00']];if(x<='2026-09-15')return['6 раз/день',['07:00','10:00','13:00','16:00','19:00','22:00']];if(x<='2026-09-17')return['6 раз/день',weekend(d)?['08:30','11:10','13:50','16:30','19:10','21:50']:['06:20','09:30','12:40','15:50','19:00','22:10']];if(x<='2026-09-24')return['4 раза/день',weekend(d)?['08:30','13:00','17:30','22:00']:['06:20','11:30','16:40','21:50']];if(x<='2026-10-01')return['3 раза/день',weekend(d)?['08:30','15:00','21:30']:['06:20','14:00','21:40']];if(x<='2026-10-08')return['2 раза/день',weekend(d)?['08:30','21:30']:['06:20','21:30']];return['1 раз/день',[weekend(d)?'08:30':'06:20']]}function render(){let out='',d=new Date(2026,8,2,12),end=new Date(2026,9,15,12),td=ymd(new Date());while(d<=end){let id=ymd(d),a=info(d),n=a[1].filter(t=>S[id+'|'+t]).length;out+=`<section class="day ${id==td?'today':''} ${n==a[1].length?'complete':''}" data-day="${id}"><div class="head"><div><b>${pad(d.getDate())}.${pad(d.getMonth()+1)} · ${WD[d.getDay()]}</b>${id==td?'<span class="tag">СЕГОДНЯ</span>':''}</div><div class="mode">${a[0]}<br>${n}/${a[1].length}</div></div><div class="doses">${a[1].map(t=>{let k=id+'|'+t,c=!!S[k];return `<label class="dose ${c?'done':''}"><input type="checkbox" data-k="${k}" ${c?'checked':''}>${t}</label>`}).join('')}</div><div class="track"><i style="width:${n/a[1].length*100}%"></i></div></section>`;d.setDate(d.getDate()+1)}document.getElementById('list').innerHTML=out;document.querySelectorAll('input').forEach(x=>x.onchange=()=>{S[x.dataset.k]=x.checked;localStorage.setItem(KEY,JSON.stringify(S));render()})}document.getElementById('save').onclick=function(){localStorage.setItem(KEY,JSON.stringify(S));this.textContent='✓ Сохранено';setTimeout(()=>this.textContent='✓ Сохранить отметки',1000)};render();setTimeout(()=>document.querySelector('.today')?.scrollIntoView({block:'start'}),150)</script></body></html>
